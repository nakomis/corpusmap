[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpusmap"
version = "0.1.0"
description = "Cluster and label a text dataset: pgvector -> UMAP -> HDBSCAN -> c-TF-IDF + LLM labels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
authors = [{ name = "Martin Harris" }]
keywords = ["umap", "hdbscan", "clustering", "embeddings", "pgvector", "topic-modelling"]

dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.5",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
fast = ["pgvector>=0.2.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
corpusmap = "corpusmap.cli:main"

[project.urls]
Homepage = "https://github.com/nakomis/corpusmap"
Dataset = "https://github.com/nakomis/corpusmap/releases/latest"

[tool.setuptools.packages.find]
include = ["corpusmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
